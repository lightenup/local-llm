# LiteLLM proxy — local-only (wave 2, C1)
#
# Image is pinned by DIGEST, not tag. A tag can be repointed at a new image;
# the 1.82.x malware advisory is exactly that failure mode. Update by editing
# LITELLM_IMAGE in .env, deliberately.
#
# Corporate TLS-inspection proxy (C7): the container cannot read the macOS
# keychain, so the NODE_EXTRA_CA_CERTS approach used for LM Studio does not
# carry over. The root CA is mounted below into the system trust directory.
# Note that nothing in this local-only configuration makes an outbound TLS
# call — oMLX is plain HTTP on the host — so the mount is inert until C2 adds
# a cloud provider.
# It is wired now and verified then; see proxy/README notes in docs/backlog.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    # Not published to the host. Nothing outside the compose network needs it,
    # and 5432 on 0.0.0.0 is a needless listener on a laptop that roams.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ${LITELLM_IMAGE:?set LITELLM_IMAGE in .env}
    container_name: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Published on all interfaces so the homelab gateway LXC can reach this
      # LiteLLM over the LAN (homelab spec 064, FR-016: oMLX stays on
      # 127.0.0.1:8000, only THIS proxy is LAN-exposed and it enforces keys and
      # access groups). Loopback is still bound, so local clients on 127.0.0.1
      # are unaffected. macOS app firewall stays on; Docker's backend is already
      # permitted inbound. The corporate proxy blocks the tailnet on this Mac,
      # so `tailscale serve` is not the path — the LAN is.
      - "0.0.0.0:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      # oMLX runs on the host; inside the container 127.0.0.1 is the container.
      # LIVE since 2026-10-11: every chat model goes through proxy/llm_queue.py
      # (:8001, one inference request at a time, §38). Roll back by pointing
      # this at :8000 and `docker compose up -d`.
      OMLX_BASE_URL: http://host.docker.internal:8001/v1
      # embed/rerank only: small calls that would stall Hermes retrieval behind
      # a multi-minute agent turn, and Hermes does not retry a 429.
      OMLX_DIRECT_BASE_URL: http://host.docker.internal:8000/v1
      OMLX_API_KEY: ${OMLX_API_KEY:?set OMLX_API_KEY in .env}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ${CORP_ROOT_CA:-/dev/null}:/usr/local/share/ca-certificates/corp-root-ca.crt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  litellm-pgdata:
