# Benchmark suites shown as cards in the dashboard's "Benchmarks" view.
#
# One [[suite]] per benchmark. `id` matches the `benchmark` field in
# results/acc_*.json (the oMLX suite name) or, for harness = true, the
# repo's own script. Required: id, name, group, measures, size, how_we_run,
# links. Optional: findings (FINDINGS § numbers), harness, run (false = bundled
# with oMLX but never run here).
#
# Groups follow bench/accuracy.py GROUPS, plus "harness" for our own scripts.

# ---- code ------------------------------------------------------------------

[[suite]]
id = "humaneval"
name = "HumanEval"
group = "code"
measures = "Writes a Python function from its signature and docstring; graded by running hidden unit tests. Short, well-known, largely saturated by current models."
size = "164 problems"
how_we_run = "All 164, deterministic sampling, thinking off unless a run says otherwise. Graded by oMLX's bundled harness."
links = [
  { label = "paper", url = "https://arxiv.org/abs/2107.03374" },
  { label = "code and data", url = "https://github.com/openai/human-eval" },
]

[[suite]]
id = "mbpp"
name = "MBPP"
group = "code"
measures = "Mostly Basic Python Problems: short entry-level programming tasks described in one sentence, graded by the three asserts that ship with each."
size = "500 problems (test split)"
how_we_run = "500 (early runs 250), deterministic sampling. Graded by oMLX's bundled harness."
links = [
  { label = "paper", url = "https://arxiv.org/abs/2108.07732" },
  { label = "dataset", url = "https://huggingface.co/datasets/google-research-datasets/mbpp" },
]

[[suite]]
id = "livecodebench"
name = "LiveCodeBench"
group = "code"
measures = "Competitive-programming problems collected after model release dates (LeetCode, AtCoder, Codeforces), so they are less likely to be in training data. Graded by running test cases."
size = "1,054 problems bundled; we sample 500"
how_we_run = "500, thinking per model, answers capped at 16,384 tokens by oMLX. Since oMLX 0.7.1rc1 the 216 functional problems are prompted as 'implement the function', so only the 284 stdin problems compare with older runs (§41). Answers that hit the cap are counted as wrong (§42)."
links = [
  { label = "paper", url = "https://arxiv.org/abs/2403.07974" },
  { label = "project", url = "https://livecodebench.github.io/" },
]
findings = [41, 42]

# ---- reason ----------------------------------------------------------------

[[suite]]
id = "mmlu_pro"
name = "MMLU-Pro"
group = "reason"
measures = "Harder, reasoning-heavy successor to MMLU: 14 subjects, ten answer options instead of four, fewer trivia questions."
size = "12,032 questions; we sample 500"
how_we_run = "500, deterministic sampling. Scored on the extracted option letter."
links = [
  { label = "paper", url = "https://arxiv.org/abs/2406.01574" },
  { label = "dataset", url = "https://huggingface.co/datasets/TIGER-Lab/MMLU-Pro" },
]

[[suite]]
id = "gsm8k"
name = "GSM8K"
group = "reason"
measures = "Grade-school maths word problems that take two to eight steps; scored on the final number."
size = "1,319 problems (test split); we sample 500"
how_we_run = "500, deterministic sampling."
links = [
  { label = "paper", url = "https://arxiv.org/abs/2110.14168" },
  { label = "code and data", url = "https://github.com/openai/grade-school-math" },
]

[[suite]]
id = "mathqa"
name = "MathQA"
group = "reason"
measures = "Multiple-choice maths word problems (GRE/GMAT level) with five options."
size = "2,985 problems (test split); we sample 500"
how_we_run = "500, deterministic sampling. oMLX's answer budget suits models that reply with one letter; a model that reasons first is cut off and scores near zero, so mathqa is left out of model comparisons (§29)."
links = [
  { label = "paper", url = "https://arxiv.org/abs/1905.13319" },
  { label = "project", url = "https://math-qa.github.io/" },
]
findings = [29]

