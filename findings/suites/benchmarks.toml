# ---- our own harnesses -----------------------------------------------------

[[suite]]
id = "taskbench"
name = "taskbench"
group = "harness"
harness = true
measures = "Jobs this stack is used for, each with a deterministic verifier: PlantUML and draw.io diagrams checked for the requested content, tool calls checked for name, argument types and enums, two-turn tool use, and Python checked by asserted behaviour."
size = "five sub-suites: puml, drawio, toolcall, toolchain, pycode"
how_we_run = "Through LiteLLM roles, as clients call them. Results stay local; nothing is uploaded."
links = [
  { label = "script", url = "../bench/taskbench.py" },
]

[[suite]]
id = "longctx"
name = "Long-context quality"
group = "harness"
harness = true
measures = "Whether a long context is usable, not just admitted: needle retrieval swept over length and depth, plus one multi-hop question per length that combines two distant facts."
size = "lengths up to 262,144 tokens"
how_we_run = "Against a role's profile, usually `long` or `fast`."
links = [
  { label = "script", url = "../bench/longctx_quality.py" },
]

[[suite]]
id = "candidate_gate"
name = "Candidate gate"
group = "harness"
harness = true
measures = "The cheap checks before any accuracy run: architecture supported, loads, real resident memory, and serves a 16k prompt while the shipped lineup stays resident."
size = "two 16k-token calls per model"
how_we_run = "Restores the lineup afterwards. --replaces drains a named model first."
links = [
  { label = "script", url = "../bench/candidate_gate.py" },
]
findings = [27, 42]

[[suite]]
id = "throughput"
name = "Throughput and context"
group = "harness"
harness = true
measures = "oMLX's own speed benchmarks: prefill and decode tokens per second by prompt length and concurrency, and the largest context the memory guard admits."
size = "per run; results in results/tp_*.json and ctx_*.json"
how_we_run = "Engine settings are recorded with every result, because a rate without its engine variant cannot be compared."
links = [
  { label = "script", url = "../bench/throughput.py" },
  { label = "context bisect", url = "../bench/ctx_bisect.py" },
]
