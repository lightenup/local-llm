section_title = "The A7 reason arms: OptiQ is dominated, gemma-4 wins, and mathqa lied"
rationale = "The leaderboard's 65.3 mmlu_pro did not replicate: we measure 61.2, and pooled McNemar says the 8-bit is better (p = 0.026) while oQ4e is indistinguishable (p = 0.797, mmlu_pro 61.2 vs 61.4). KL-divergence-driven per-layer allocation lands exactly where oq4e.py's simpler allocation landed, is 3.1 GiB larger, and has no speculative decoding at all against oQ4e's measured 1.73x. Data-driven allocation asked twice, answered no twice."
