id      = "deadend_concurrency_limit"
title   = "Raising the concurrency limit"
status  = "dead-end"
models  = ["Qwen3.8-27B-8bit"]
section = 8
section_title = "What the validation runs settled"
rationale = "Concurrency is prefill-bound: eight concurrent requests buy 1.38x aggregate throughput and cost 4.9x p95 latency (28.42 t/s, p95 31.2 s vs 20.66 t/s, 6.4 s at one). Two are worse than one (scaling efficiency 0.44). Each client sent a distinct ~1,035-token cold prompt, so ~8,300 tokens of prefill consumed roughly half the wall; the engine's decode batching is fine — feeding it eight cold prompts is what does not scale. The lever for parallel agent work is prefix-cache hit rate, not the limit."
updated = 2026-09-22

