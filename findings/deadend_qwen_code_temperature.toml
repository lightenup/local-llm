id      = "deadend_qwen_code_temperature"
title   = "qwen-code temperature 0.3"
status  = "dead-end"
models  = ["Qwen3.8-27B-8bit"]
section = 8
section_title = "What the validation runs settled"
rationale = "No measurable difference, keep 0.7. The suite scores looked like a clean win for 0.3 (humaneval 92.1, mbpp 78.4, livecodebench 58.0), but the paired test says otherwise: temperature churns 108 of 500 livecodebench verdicts (~22% of the suite) in a nearly even split (51 against 57), and the +1.2 point suite gap is the small net residue of a large amount of noise. Pooled p = 0.27. qwen-code stays at 0.7, the Qwen-published default, because nothing was measured that justifies moving it."
updated = 2026-09-22
