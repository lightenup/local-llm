id      = "open_splash_8bit"
title   = "Splash serves the 8-bit 3–5× faster at the same scores"
status  = "open"
models  = ["Qwen3.8-27B-8bit"]
section = 45
section_title = "Splash, part 2: the 8-bit scores the same, coexists, and reaches 262k"
updated = 2026-11-10
rationale = "Splash (an external Metal engine with DFlash2 speculative decoding) passes every check §44 set: accuracy within its own run-to-run noise (reason p = 0.85, general 0.55, safety 0.63), coexistence with the lineup, prefix cache that survives a reload, and retrieval to 262k with the base max_context_window raised. The shipped 8-bit still runs on MLX: promotion is a separate change with its own doctor run, and two things are unsettled, the KV pool a 262144 base context holds for every profile and cold concurrent prefill. §44–§45."

[[metrics]]
name      = "decode @ 16k prompt"
unit      = "tok/s"
direction = "higher"
headline  = true
tooltip_what     = "Sustained decode throughput at a 16,384-token prompt, single stream, on Splash."
tooltip_how      = "bench/throughput.py, code_python context, 128-token generations; MLX baseline is the shipped plain variant on the same oMLX build."
tooltip_evidence = "3.3x at 1k to 5.2x at 16k; depends on what the drafter guesses, so agent and prose traffic see less; see §44."
source_file = "tp_splash_8bit.json"
source_path  = "summary[?pp=16384].decode_tps"
baseline_label = "MLX"
baseline_source_file = "tp_mlx_8bit_plain_074.json"
baseline_source_path = "summary[?pp=16384].decode_tps"

